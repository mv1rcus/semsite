        .lv *{box-sizing:border-box}.lv a,.lv button,.lv input{font-family:inherit}
        .lv .wrap{max-width:1200px;margin:0 auto;padding:0 28px}

        .lv .nav{display:flex;align-items:center;gap:30px;height:88px}

        .lv .logo i{font-style:normal;color:${Tu}}

        .lv .cartb b{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:${Tu};color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 5px}
        .lv .burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
        .lv .btn{background:${Bl};color:#fff;border:0;border-radius:8px;padding:0 30px;min-height:54px;font-weight:600;font-size:14.5px;letter-spacing:.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
        .lv .btn.o{background:transparent;color:${Bl};border:1.5px solid ${Bl}}
        .lv .btn.or{background:${Tu}}
        .lv .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:40px 28px 60px;min-height:620px}
        .lv .hero h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:clamp(58px,8vw,112px);line-height:.96;letter-spacing:-3px;margin:0;text-wrap:balance}

        .lv .hero .im{position:relative;display:flex;justify-content:center}
