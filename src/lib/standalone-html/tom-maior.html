        .vl .path{max-width:1180px;margin:0 auto;padding:0 5vw 80px;display:grid;grid-template-columns:.8fr 2fr;gap:30px;align-items:center}
        .vl .opts{background:#fff;border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 6px 26px rgba(80,50,20,.08)}
        .vl .opts button{text-align:left;background:none;border:0;border-right:1px solid #eadfd2;padding:26px;cursor:pointer;color:${bu}}.vl .opts button:last-child{border:0}
        .vl .opts button.on{background:${Gi}}.vl .opts h3{font-size:17px;margin:0 0 8px}.vl .opts p{font-size:14px;color:${Tu};margin:0 0 16px;line-height:1.5}.vl .opts span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${ie}}
        .vl .band{position:relative;max-width:1180px;margin:0 auto 80px;height:210px;border-radius:18px;overflow:hidden;background:#241911;color:#fff;display:flex;align-items:center;padding:0 54px}
        .vl .band p{position:relative;z-index:2;font-family:'Source Serif 4',serif;font-weight:600;font-size:clamp(22px,2.6vw,32px);line-height:1.35;max-width:520px;margin:0}.vl .band p em{font-style:normal;color:${Kl}}
        .vl .ask{background:${Gi};padding:80px 5vw}.vl .ask .in{max-width:760px;margin:0 auto;text-align:center}
        .vl .fm{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px;text-align:left}.vl .fm label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${Tu};margin-bottom:8px}
        .vl .fm input{width:100%;height:52px;border:1px solid #d9c6b2;background:#fff;border-radius:12px;padding:0 16px;font-size:16px;color:${bu}}
        .vl .sel{display:flex;gap:10px;flex-wrap:wrap}.vl .sel button{border:1px solid #d9c6b2;background:#fff;border-radius:99px;padding:12px 20px;font-size:14px;cursor:pointer;color:${bu}}.vl .sel button.on{background:${Kl};border-color:${Kl};color:#fff}
        .vl .full{grid-column:span 2}
        .vl footer{background:${Bi};color:#d8cabb;padding:50px 5vw;text-align:center}.vl footer nav{display:flex;gap:26px;justify-content:center;margin:20px 0;font-size:13px}.vl footer a{cursor:pointer}.vl footer span{font-size:13px;color:#a8998a}
        .vl .wa{position:fixed;right:18px;bottom:18px;z-index:50;width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
        .vl .mob{display:none}
        @media(max-width:860px){
          .vl .nl,.vl .nav>.btn{display:none}.vl .burger{display:block;margin-left:auto}
          .vl .mob{display:block;background:#fff;color:${bu};margin:0 16px;border-radius:12px;position:relative;z-index:6}.vl .mob a{display:block;padding:15px 20px;border-top:1px solid #eadfd2;font-size:14px;cursor:pointer}.vl .mob a:first-child{border:0}
          .vl .hero{padding-bottom:110px}.vl .hero .ph{width:100%;opacity:.55}.vl .hero:before{background:linear-gradient(180deg,rgba(18,13,10,.82),rgba(18,13,10,.6))}
          .vl .hero h1{margin-top:44px}.vl .quote{display:none}
          .vl .feat{grid-template-columns:1fr;margin:-70px 16px 0;padding:10px 0}.vl .feat div{border-right:0;border-bottom:1px solid #eadfd2;padding:20px}.vl .feat div:last-child{border:0}
          .vl .mission,.vl .path{grid-template-columns:1fr;gap:30px}.vl .mission{padding-top:70px}.vl .cards,.vl .opts{grid-template-columns:1fr}.vl .opts button{border-right:0;border-bottom:1px solid #eadfd2}
          .vl .band{margin:0 16px 60px;padding:0 26px;height:240px}.vl .fm{grid-template-columns:1fr}.vl .full{grid-column:span 1}
        }
