        .tf *{box-sizing:border-box}
        .tf a,.tf button{font-family:inherit}
        .tf .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
        .tf .nav{display:flex;align-items:center;justify-content:space-between;height:84px;gap:20px;position:relative;z-index:5}
        .tf .logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:600;font-size:24px;letter-spacing:.5px;color:${Yl}}
        .tf .links{display:flex;gap:32px;font-size:15px;font-weight:500}
        .tf .links a{color:${Jl};cursor:pointer;transition:color .2s}.tf .links a:hover{color:${Yl}}
        .tf .btn{background:${El};color:#06251f;border:0;border-radius:999px;padding:0 26px;min-height:50px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;text-decoration:none;box-shadow:0 10px 26px rgba(29,187,154,.28)}
        .tf .btn:hover{background:#2ad6b2}
        .tf .btn.o{background:transparent;color:${Yl};border:1.5px solid #3a3a40;box-shadow:none}
        .tf .btn.o:hover{border-color:${El};color:${El}}
        .tf .burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
        .tf .hero{position:relative;overflow:hidden;background:radial-gradient(900px 500px at 85% -10%,rgba(29,187,154,.08),transparent 60%),${z0}}
        .tf .herogrid{display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:20px;min-height:600px}
        .tf .himg{position:relative;align-self:stretch;display:flex;align-items:flex-end;justify-content:center}
        .tf .himg .arch{position:absolute;inset:8% 12% 0;background:${pu};border:1px solid #26262b;border-bottom:0;border-radius:280px 280px 0 0}
        .tf .himg img{position:relative;z-index:2;width:min(78%,420px);filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
        .tf .kick{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:3.5px;text-transform:uppercase;font-weight:600;color:${El}}
        .tf .kick:before{content:"";width:34px;height:1.5px;background:${El};display:block}
        .tf h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(44px,5.6vw,74px);line-height:1.04;margin:18px 0 0;color:${Yl};letter-spacing:-1px}
        .tf h1 em{font-style:italic;font-weight:500;color:${El}}
        .tf .lead{font-size:17.5px;line-height:1.7;color:${Jl};margin:22px 0 30px;max-width:460px}
        .tf .stats{display:flex;gap:38px;margin-top:38px}

        .tf .stats span{font-size:13.5px;color:${Jl}}
        .tf .sec{padding:70px 0}

        .tf h2 em{font-style:italic;color:${El}}
        .tf .sh i{flex:1;height:1px;background:#2a2a30;display:block}
        .tf .svc{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
        .tf .sitem{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid #232328}
        .tf .sitem:last-child{border:0}
        .tf .sitem .ck{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(29,187,154,.12);display:grid;place-items:center}
        .tf .sitem b{font-size:17px;font-weight:600;display:block;margin-bottom:4px}
        .tf .sitem p{margin:0;font-size:14.5px;color:${Jl};line-height:1.55}
